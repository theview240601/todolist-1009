<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 업무 할 일</title>
  <!-- 손글씨 느낌 글꼴 (인터넷이 없으면 기본 글꼴로 보임) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 반짝이 별 모양 (아래에서 여러 번 꺼내 씀) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="sparkle" viewBox="0 0 24 24">
        <path d="M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- 배경 그림: 숲색 덩어리, 주황 선, 반짝이 -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <svg class="scribble" viewBox="0 0 160 320" fill="none">
      <path d="M40 6c10 40-14 70 6 104 14 24 52 10 60 38 8 30-40 34-38 64 2 26 40 20 46 50 4 22-18 40-30 52M46 110c-22-6-40 8-38 30M106 148c18-8 40 2 44 22"/>
    </svg>
    <svg class="spark sp1"><use href="#sparkle"/></svg>
    <svg class="spark sp2 outline"><use href="#sparkle"/></svg>
    <svg class="spark sp3"><use href="#sparkle"/></svg>
    <svg class="spark sp4 outline"><use href="#sparkle"/></svg>
    <svg class="spark sp5"><use href="#sparkle"/></svg>
  </div>

  <div class="app">
    <header class="top">
      <div class="title-wrap">
        <h1>내 업무 할 일</h1>
        <svg class="title-spark ts1" aria-hidden="true"><use href="#sparkle"/></svg>
        <svg class="title-spark ts2" aria-hidden="true"><use href="#sparkle"/></svg>
        <p class="today" id="today"></p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="layout">
      <!-- 왼쪽: 프로젝트(분류) 목록 -->
      <aside class="sidebar card">
        <h2 class="section-title">프로젝트</h2>
        <ul class="project-list" id="projectList"></ul>
        <form class="project-form" id="projectForm" autocomplete="off">
          <input type="text" id="projectInput" placeholder="새 프로젝트 이름" maxlength="30" aria-label="새 프로젝트 이름">
          <button type="submit" class="btn">추가</button>
        </form>
      </aside>

      <main class="main">
        <!-- 할 일 입력칸 (수정할 때도 같은 칸을 씀) -->
        <form class="task-form card" id="taskForm" autocomplete="off">
          <p class="edit-banner" id="editBanner" hidden>할 일을 수정하는 중이에요</p>
          <input type="text" id="titleInput" class="title-input" placeholder="할 일을 입력하세요 (예: 주간 보고서 초안 쓰기)" maxlength="200" required aria-label="할 일 제목">
          <div class="field-row">
            <label class="field">
              <span>프로젝트</span>
              <select id="projectSelect"></select>
            </label>
            <label class="field">
              <span>마감일</span>
              <input type="date" id="dueInput">
            </label>
            <label class="field">
              <span>중요도</span>
              <select id="priorityInput">
                <option value="high">높음</option>
                <option value="mid" selected>보통</option>
                <option value="low">낮음</option>
              </select>
            </label>
          </div>
          <textarea id="memoInput" rows="2" maxlength="1000" placeholder="메모 (선택)" aria-label="메모"></textarea>
          <div class="form-actions">
            <button type="button" class="btn" id="cancelEditBtn" hidden>취소</button>
            <button type="submit" class="btn primary" id="submitBtn">추가</button>
          </div>
        </form>

        <!-- 목록 위 보기 옵션 -->
        <section class="list-card card">
          <div class="list-head">
            <h2 class="section-title" id="listTitle">전체</h2>
            <button type="button" class="btn small ghost" id="clearDoneBtn">완료한 일 지우기</button>
          </div>
          <div class="toolbar">
            <input type="search" id="searchInput" placeholder="제목·메모에서 찾기" aria-label="검색">
            <select id="filterSelect" aria-label="보기">
              <option value="all">전체 보기</option>
              <option value="open">할 일만</option>
              <option value="done">완료만</option>
            </select>
            <select id="sortSelect" aria-label="정렬">
              <option value="due">마감일 빠른 순</option>
              <option value="priority">중요도 높은 순</option>
              <option value="created">최근 추가한 순</option>
            </select>
          </div>
          <ul class="task-list" id="taskList"></ul>
          <p class="empty" id="emptyMsg" hidden></p>
        </section>
      </main>
    </div>
  </div>

  <!-- 동작 코드: 순서가 중요해요 (앞 파일의 내용을 뒤 파일이 씀) -->
  <script src="js/storage.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/render.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
